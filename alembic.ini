# Alembic configuration for the CV Inference Service.
#
# The database URL is intentionally NOT set here. alembic/env.py injects it from
# api.config.settings.database_url at runtime, so migrations always target the
# same URL as the application (single source of truth, and no secrets in git).

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Prepend the project root to sys.path so `import api...` works inside env.py.
prepend_sys_path = .

# Template used to name new migration files.
# e.g. YYYYMMDD_HHMM_<rev>_<slug>.py — chronologically sortable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use OS-native path separators when writing version file paths.
version_path_separator = os

# Timezone for the timestamps in file_template (UTC keeps ordering stable).
timezone = UTC


# ─────────────────────────────────────────────────────────────
# Logging (standard Alembic setup)
# ─────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
